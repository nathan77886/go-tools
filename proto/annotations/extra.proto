syntax = "proto3";

package annotations;

option go_package = "github.com/nathan77886/go-tools/proto/annotations";

import "google/protobuf/descriptor.proto";
// 是否为白名单接口（免权限校验）
extend google.protobuf.MethodOptions {
  bool white_list = 50001;
}
// 新增：前端权限分组（面包屑/菜单层级）
// 例：["用户管理","用户列表","封禁"]
message FrontGroup {
  repeated string nodes = 1;
}

extend google.protobuf.MethodOptions {
  FrontGroup front_group = 50002;
}